[package]
name = "aibox"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Run Codex or Claude Code in a Docker Filesystem Sandbox with persistent Tenants"
license = "BSD-2-Clause"
repository = "https://github.com/rbee3u/aibox"
publish = false

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", features = ["http2"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
tempfile = "3"
signal-hook = "0.4"
rustix = { version = "1", features = ["fs", "process"] }
libc = "0.2"
anyhow = "1"
walkdir = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", default-features = false }
tokio-util = { version = "0.7", features = ["io", "rt"] }
toml_edit = { version = "0.25", features = ["serde"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7"] }
zstd = { version = "0.13", default-features = false }
fs2 = "0.4"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = "thin"
