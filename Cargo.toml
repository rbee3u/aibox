[package]
name = "aibox"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Run Codex or Claude Code in a Docker Filesystem Sandbox with persistent Tenants"
license = "BSD-2-Clause"
repository = "https://github.com/rbee3u/aibox"
readme = "README.md"
categories = ["command-line-utilities", "development-tools"]
keywords = ["docker", "sandbox", "claude", "codex", "agent"]

# Single CLI binary; the library target exposes only the application entry point.
[lib]
name = "aibox"
path = "src/lib.rs"

[[bin]]
name = "aibox"
path = "src/main.rs"

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", features = ["http2"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls-native-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tempfile = "3"
signal-hook = "0.3"
rustix = { version = "0.38", features = ["process"] }
libc = "0.2"
anyhow = "1"
walkdir = "2"
time = { version = "=0.3.44", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io", "rt"] }
toml_edit = { version = "0.22", features = ["serde"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = "thin"
