[package]
name = "aibox"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Run Codex or Claude Code in a Docker Filesystem Sandbox with persistent Tenants"
license = "BSD-2-Clause"
repository = "https://github.com/rbee3u/aibox"
readme = "README.md"
categories = ["command-line-utilities", "development-tools"]
keywords = ["docker", "sandbox", "claude", "codex", "agent"]

# Single CLI binary; the library target exposes only the application entry point.
[lib]
name = "aibox"
path = "src/lib.rs"

[[bin]]
name = "aibox"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
signal-hook = "0.3"
rustix = { version = "0.38", features = ["process"] }
libc = "0.2"
anyhow = "1"
walkdir = "2"
toml_edit = { version = "0.22", features = ["serde"] }

[profile.release]
strip = true
lto = "thin"
